# dsh-cmpct bundle patch: registers the cmpct tool family at the host plane
# (profile bundle layer). Tools land in the global tools registry — every
# session of every preset sees them.
#
# The compaction engine resolves LAZILY inside the plugin: a realm-provided
# engine via ctx.get('compaction') when the session's preset carries
# dsh-compaction-basic, else a self-hosted BasicCompactionEngine(auto:false)
# imported on demand. No compaction row is required here.
#
# COLLISION WARNING: never mount this bundle alongside a preset that already
# carries its own cmpct rows (e.g. the cmpct agent preset) — tool names live
# in a shared registry and duplicate registration fails.
- insert:
    - id: cmpct-region
      name: './plugins/compact-region.mjs'

    - id: cmpct-stats
      name: './plugins/compact-stats.mjs'
